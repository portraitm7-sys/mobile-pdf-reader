name: mobile_pdf_reader
description: A clean offline PDF reader for Android and iOS built with Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^13.1.0
  path: ^1.9.1
  path_provider: ^2.1.6
  pdfrx: ^2.6.5
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
